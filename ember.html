<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>余烬</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070b'/%3E%3Cpath d='M7 19a9 9 0 0 1 18 0Z' fill='%23f4c777'/%3E%3Cpath d='M5 20h22' stroke='%237f6d53' stroke-width='1'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070b; }
    body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    .scene { position: fixed; inset: 0; margin: 0; background: radial-gradient(ellipse at 76% 35%, #19171a, #090c12 50%, #030508); }
    .landscape { display: block; width: 100%; height: 100%; }
    /* DAWN: -.. / .- / .-- / -.  一点 400ms；划三点长。
       符号内停一点，字母间停三点，每轮结束停七点。
       所有发光元素共用一个动画，保证光核、光晕与光芒同步。 */
    .morse-signal { opacity: 0; animation: solar-code 16.8s steps(1, end) 1.6s infinite; }
    @keyframes solar-code {
      0.00000000% { opacity: 1; }
      7.14285714% { opacity: 0; }
      9.52380952% { opacity: 1; }
      11.90476190% { opacity: 0; }
      14.28571429% { opacity: 1; }
      16.66666667% { opacity: 0; }
      23.80952381% { opacity: 1; }
      26.19047619% { opacity: 0; }
      28.57142857% { opacity: 1; }
      35.71428571% { opacity: 0; }
      42.85714286% { opacity: 1; }
      45.23809524% { opacity: 0; }
      47.61904762% { opacity: 1; }
      54.76190476% { opacity: 0; }
      57.14285714% { opacity: 1; }
      64.28571429% { opacity: 0; }
      71.42857143% { opacity: 1; }
      78.57142857% { opacity: 0; }
      80.95238095% { opacity: 1; }
      83.33333333% { opacity: 0; }
      100% { opacity: 0; }
    }
    .pause-input { position: fixed; z-index: 4; right: 24px; bottom: 24px; width: 36px; height: 36px; margin: 0; opacity: 0; pointer-events: none; }
    .pause-control { position: fixed; z-index: 3; right: 24px; bottom: 24px; width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid #9c8c6d66; border-radius: 50%; color: #d4c2a0; background: #0c0d12d9; opacity: 0; pointer-events: none; }
    .pause-control svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .pause-control .play { display: none; }
    .pause-input:focus-visible + .pause-control { opacity: 1; pointer-events: auto; outline: 2px solid #d6b777; outline-offset: 4px; }
    .pause-input:checked + .pause-control .play { display: block; }
    .pause-input:checked + .pause-control .pause { display: none; }
    .pause-input:checked ~ .scene .morse-signal { animation-play-state: paused; }
    @media (max-width: 600px) { .pause-control, .pause-input { right: 14px; bottom: 14px; } }
    @media (prefers-reduced-motion: reduce) { .outer-halo { opacity: .55; } .rays { display: none; } }
  </style>
</head>
